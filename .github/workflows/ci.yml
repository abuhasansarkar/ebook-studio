name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # A throwaway secret. CI runs against isolated services and never touches a
  # live provider, so this value only has to be unpredictable within the run.
  BETTER_AUTH_SECRET: ci-only-secret-not-used-in-production-0000000000
  # Required by the API's schema; CI signs its own test webhooks with it.
  PAYMENT_WEBHOOK_SECRET: ci-only-webhook-secret-not-used-in-production-00

jobs:
  verify:
    name: Typecheck, lint, schema drift and unit tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ebook
          POSTGRES_PASSWORD: ebook
          POSTGRES_DB: ebook_studio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ebook -d ebook_studio"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The backup tests run pg_dump/psql against the PostgreSQL 17 service;
      # the runner's default client is older and refuses to dump a newer server.
      - name: Install the PostgreSQL 17 client tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          pg_dump --version

      # The CJK interior fonts are git-ignored and downloaded by hash. Without
      # them the PDF tests fail, so they are fetched (and cached by manifest).
      - name: Cache the fetched fonts
        uses: actions/cache@v4
        with:
          path: backend/assets/fonts/fetched
          key: fonts-${{ hashFiles('backend/assets/fonts/manifest.json') }}

      - name: Fetch the bundled fonts
        working-directory: backend
        run: pnpm fonts:fetch

      - name: Apply migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://ebook:ebook@localhost:5432/ebook_studio
        run: pnpm exec prisma migrate deploy

      # Migrations are hand-written; this fails when schema.prisma and the
      # migrated database disagree (a missing or wrong migration).
      - name: Check the schema matches the migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://ebook:ebook@localhost:5432/ebook_studio
        run: pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Includes the database-free tests/pure-*.test.ts files; the separate
      # vitest.pure.config.ts exists for running those without services.
      - name: Backend tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://ebook:ebook@localhost:5432/ebook_studio
          REDIS_URL: redis://localhost:6379
          QUEUE_NAMESPACE: ci
          AI_MOCK: "1"
          NODE_ENV: test
          SMTP_HOST: localhost
          SMTP_PORT: 1025
          BACKUP_DIR: ${{ runner.temp }}/backups
        run: pnpm test

  build:
    name: Production builds
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Backend build
        working-directory: backend
        env:
          DATABASE_URL: postgresql://ebook:ebook@localhost:5432/ebook_studio
        run: pnpm build

      - name: Frontend build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm build

  e2e:
    name: Browser journeys
    runs-on: ubuntu-latest
    needs: verify

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ebook
          POSTGRES_PASSWORD: ebook
          POSTGRES_DB: ebook_studio_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ebook -d ebook_studio_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.34.0
        ports: ["1025:1025", "8025:8025"]

    env:
      # Every journey writes its screenshots here, so a failure uploads them.
      SHOTS_DIR: ${{ github.workspace }}/e2e-shots

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the browser Puppeteer drives
        working-directory: e2e
        run: pnpm exec puppeteer browsers install chrome

      - name: Cache the fetched fonts
        uses: actions/cache@v4
        with:
          path: backend/assets/fonts/fetched
          key: fonts-${{ hashFiles('backend/assets/fonts/manifest.json') }}

      - name: Fetch the bundled fonts
        working-directory: backend
        run: pnpm fonts:fetch

      - name: Apply migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://ebook:ebook@localhost:5432/ebook_studio_e2e
        run: pnpm exec prisma migrate deploy

      - name: Start the API and the worker
        run: |
          set -euo pipefail
          mkdir -p .tmp-logs "$SHOTS_DIR"
          cd backend
          DATABASE_URL=postgresql://ebook:ebook@localhost:5432/ebook_studio_e2e \
          REDIS_URL=redis://localhost:6379 \
          QUEUE_NAMESPACE=ci-e2e \
          AI_MOCK=1 \
          BETTER_AUTH_SECRET="$BETTER_AUTH_SECRET" \
          PAYMENT_WEBHOOK_SECRET="$PAYMENT_WEBHOOK_SECRET" \
          PAYMENT_PROVIDER=local \
          API_RATE_LIMIT_PER_MINUTE=5000 \
          APP_URL=http://localhost:3100 \
          BETTER_AUTH_URL=http://localhost:3100 \
          PORT=4100 \
          SMTP_HOST=localhost SMTP_PORT=1025 \
          STORAGE_DIR="$GITHUB_WORKSPACE/backend/storage-e2e" \
            pnpm exec tsx src/server.ts > ../.tmp-logs/api.log 2>&1 &
          DATABASE_URL=postgresql://ebook:ebook@localhost:5432/ebook_studio_e2e \
          REDIS_URL=redis://localhost:6379 \
          QUEUE_NAMESPACE=ci-e2e \
          AI_MOCK=1 \
          BETTER_AUTH_SECRET="$BETTER_AUTH_SECRET" \
          PAYMENT_WEBHOOK_SECRET="$PAYMENT_WEBHOOK_SECRET" \
          PAYMENT_PROVIDER=local \
          API_RATE_LIMIT_PER_MINUTE=5000 \
          APP_URL=http://localhost:3100 \
          BETTER_AUTH_URL=http://localhost:3100 \
          STORAGE_DIR="$GITHUB_WORKSPACE/backend/storage-e2e" \
            pnpm exec tsx src/worker.ts > ../.tmp-logs/worker.log 2>&1 &

      - name: Start the frontend
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          BACKEND_INTERNAL_URL: http://localhost:4100
        run: |
          set -euo pipefail
          # The release build is what the journeys are meant to exercise, so the
          # build runs here rather than being taken from the build job's output.
          pnpm exec next build > ../.tmp-logs/frontend-build.log 2>&1
          pnpm exec next start -p 3100 > ../.tmp-logs/frontend.log 2>&1 &

      - name: Wait for the stack to answer
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:4100/api/v1/health > /dev/null 2>&1 \
               && curl -fsS http://localhost:3100/login > /dev/null 2>&1; then
              echo "stack ready"
              exit 0
            fi
            sleep 2
          done
          echo "the stack did not become ready"
          cat .tmp-logs/api.log .tmp-logs/worker.log .tmp-logs/frontend.log .tmp-logs/frontend-build.log || true
          exit 1

      # The account journey signs in as an operator to reach the status panel.
      # The operator is a normal verified account (sign-up + emailed code via
      # Mailpit) that is then granted a role, the one step no screen offers.
      - name: Create the operator account
        env:
          E2E_DATABASE_URL: postgresql://ebook:ebook@localhost:5432/ebook_studio_e2e
        run: |
          set -euo pipefail
          email="e2e-operator-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.com"
          password="password123"
          api=http://localhost:3100/api/v1/auth
          curl -fsS -X POST "$api/sign-up/email" -H 'Content-Type: application/json' -H 'Origin: http://localhost:3100' \
            -d "{\"email\":\"$email\",\"password\":\"$password\",\"name\":\"E2E Operator\"}" > /dev/null
          otp=""
          for i in $(seq 1 40); do
            otp=$(curl -fsS --get --data-urlencode "query=to:$email" http://localhost:8025/api/v1/search \
              | jq -r '.messages[0].Snippet // ""' | grep -oE '[0-9]{6}' | head -n1 || true)
            [ -n "$otp" ] && break
            sleep 0.5
          done
          [ -n "$otp" ] || { echo "no verification code arrived for the operator"; exit 1; }
          curl -fsS -X POST "$api/email-otp/verify-email" -H 'Content-Type: application/json' -H 'Origin: http://localhost:3100' \
            -d "{\"email\":\"$email\",\"otp\":\"$otp\"}" > /dev/null
          psql "$E2E_DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "INSERT INTO admin_roles (id, \"userId\", role, reason, \"grantedAt\") SELECT 'e2e-ci-operator', id, 'administrator', 'CI operator for the account journey.', now() FROM \"user\" WHERE email = '$email'"
          echo "OPERATOR_EMAIL=$email" >> "$GITHUB_ENV"
          echo "OPERATOR_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Run the browser journeys
        working-directory: e2e
        env:
          BASE_URL: http://localhost:3100
          MAILPIT_URL: http://localhost:8025
          # The journeys that need an operator role write it over TCP.
          E2E_DATABASE_URL: postgresql://ebook:ebook@localhost:5432/ebook_studio_e2e
        run: |
          set -euo pipefail
          pnpm run e2e
          pnpm run e2e:library
          pnpm run e2e:sources
          pnpm run e2e:citations
          pnpm run e2e:billing
          pnpm run e2e:studio
          pnpm run e2e:listing
          pnpm run e2e:support
          pnpm run e2e:wiring
          pnpm run e2e:brief-roles
          pnpm run e2e:account

      - name: Upload the run logs and screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            .tmp-logs/
            e2e-shots/
          if-no-files-found: ignore
          retention-days: 7
