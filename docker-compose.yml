name: ebook-studio

x-backend-env: &backend-env
  NODE_ENV: production
  QUEUE_NAMESPACE: ${DOCKER_QUEUE_NAMESPACE:-docker-local}
  PORT: "4000"
  DATABASE_URL: postgresql://ebook:ebook@postgres:5432/ebook_studio
  REDIS_URL: redis://redis:6379
  APP_URL: ${DOCKER_PUBLIC_URL:-http://localhost:8080}
  BETTER_AUTH_URL: ${DOCKER_PUBLIC_URL:-http://localhost:8080}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  # Payments. PAYMENT_WEBHOOK_SECRET is required by the API's schema, so the
  # container refuses to start without it.
  PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-local}
  PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?set PAYMENT_WEBHOOK_SECRET in .env}
  PAYMENT_WEBHOOK_TOLERANCE_SECONDS: ${PAYMENT_WEBHOOK_TOLERANCE_SECONDS:-300}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_FROM: ${SMTP_FROM:-eBookStudio <no-reply@ebookstudio.local>}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_TEXT_MODEL: ${OPENAI_TEXT_MODEL:-gpt-5-mini}
  OPENAI_QUALITY_MODEL: ${OPENAI_QUALITY_MODEL:-gpt-5}
  AI_MOCK: ${AI_MOCK:-0}
  # Empty S3_ENDPOINT = local filesystem storage on the shared "storage" volume.
  # Point these at AWS S3 / Cloudflare R2 / any S3-compatible service for production.
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-ebook-studio}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ebook
      POSTGRES_PASSWORD: ebook
      POSTGRES_DB: ebook_studio
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ebook -d ebook_studio"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    command: ["sh", "-c", "pnpm exec prisma migrate deploy && node dist/server.js"]
    environment: *backend-env
    volumes: [storage:/app/backend/storage]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: { context: ., dockerfile: backend/Dockerfile }
    command: ["node", "dist/worker.js"]
    environment: *backend-env
    volumes: [storage:/app/backend/storage]
    depends_on:
      backend: { condition: service_healthy }

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      BACKEND_INTERNAL_URL: http://backend:4000
    depends_on:
      backend: { condition: service_healthy }

  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes: [./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [frontend, backend]

volumes:
  pgdata:
  redisdata:
  storage:
