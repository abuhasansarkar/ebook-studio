name: ebook-studio

# Development defaults are kept so `docker compose up` works on a laptop; every
# credential can be overridden from .env. See .env.example ("Docker").

x-database-url: &database-url ${DOCKER_DATABASE_URL:-postgresql://${POSTGRES_USER:-ebook}:${POSTGRES_PASSWORD:-ebook}@postgres:5432/${POSTGRES_DB:-ebook_studio}}

x-backend-env: &backend-env
  NODE_ENV: production
  QUEUE_NAMESPACE: ${DOCKER_QUEUE_NAMESPACE:-docker-local}
  PORT: "4000"
  DATABASE_URL: *database-url
  REDIS_URL: ${DOCKER_REDIS_URL:-redis://redis:6379}
  APP_URL: ${DOCKER_PUBLIC_URL:-http://localhost:8080}
  BETTER_AUTH_URL: ${DOCKER_PUBLIC_URL:-http://localhost:8080}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
  # Exactly one proxy (nginx) sits in front of the API, so Express takes the
  # address nginx appended to X-Forwarded-For. Add hops if a load balancer or
  # CDN sits in front of nginx; never `true`.
  TRUST_PROXY: ${DOCKER_TRUST_PROXY:-1}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  # Payments. Production refuses to start unless PAYMENT_PROVIDER is set
  # explicitly; PAYMENT_WEBHOOK_SECRET is required by the API's schema.
  PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-}
  # The local processor grants credits without taking payment, so a production
  # build refuses it unless this is set. Set it only on a private test stack.
  ALLOW_LOCAL_PAYMENTS: ${ALLOW_LOCAL_PAYMENTS:-false}
  PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?set PAYMENT_WEBHOOK_SECRET in .env}
  PAYMENT_WEBHOOK_TOLERANCE_SECONDS: ${PAYMENT_WEBHOOK_TOLERANCE_SECONDS:-300}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  # No silent Mailpit default: production refuses to start without a mail
  # server. For a local stack set SMTP_HOST=mailpit (SMTP_PORT=1025).
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_FROM: ${SMTP_FROM:-eBookStudio <no-reply@ebookstudio.local>}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_TEXT_MODEL: ${OPENAI_TEXT_MODEL:-gpt-5-mini}
  OPENAI_QUALITY_MODEL: ${OPENAI_QUALITY_MODEL:-gpt-5}
  AI_MOCK: ${AI_MOCK:-0}
  API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-300}
  # Local filesystem storage on the shared "storage" volume when S3_ENDPOINT is
  # empty. Point the S3 settings at AWS S3 / Cloudflare R2 / any S3-compatible
  # service for production.
  STORAGE_DIR: /app/backend/storage
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-ebook-studio}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
  ALERT_DESTINATION: ${ALERT_DESTINATION:-}
  # Backups are written inside the container with the image's pg_dump/psql
  # (PostgreSQL 17 client), connecting with DATABASE_URL. The "backups" volume
  # keeps them when the container is recreated.
  BACKUP_DIR: /app/backend/backups

services:
  postgres:
    restart: unless-stopped
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ebook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ebook}
      POSTGRES_DB: ${POSTGRES_DB:-ebook_studio}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      # $$ defers expansion to the container, which has these variables set.
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    restart: unless-stopped
    image: axllent/mailpit:v1.34.0
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]

  # One-shot schema migration. The API and worker start only after it exits 0,
  # so neither runs against a half-migrated database and neither has to wrap
  # node in a shell (which kept SIGTERM from reaching it).
  migrate:
    build: { context: ., dockerfile: backend/Dockerfile, target: migrate }
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  backend:
    restart: unless-stopped
    build: { context: ., dockerfile: backend/Dockerfile }
    command: ["node", "dist/server.js"]
    environment: *backend-env
    volumes:
      - storage:/app/backend/storage
      - backups:/app/backend/backups
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    restart: unless-stopped
    build: { context: ., dockerfile: backend/Dockerfile }
    command: ["node", "dist/worker.js"]
    environment: *backend-env
    volumes:
      - storage:/app/backend/storage
      - backups:/app/backend/backups
    depends_on:
      migrate: { condition: service_completed_successfully }
      backend: { condition: service_healthy }
    # The worker publishes a Redis heartbeat every 10 s with a 30 s TTL; the
    # check fails once no fresh heartbeat for this configuration exists.
    healthcheck:
      test: ["CMD", "node", "dist/worker-healthcheck.js"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s

  frontend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      BACKEND_INTERNAL_URL: http://backend:4000
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  nginx:
    restart: unless-stopped
    image: nginx:1.27-alpine
    # Loopback by default: the stack speaks plain HTTP, so expose it publicly
    # only behind TLS (see nginx/default.conf). DOCKER_PUBLIC_BIND=0.0.0.0:80
    # publishes it on every interface.
    ports: ["${DOCKER_PUBLIC_BIND:-127.0.0.1:8080}:80"]
    volumes: [./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on:
      frontend: { condition: service_healthy }
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/v1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
  storage:
  backups:
