# Reverse proxy for the Docker stack: /api -> backend, everything else -> Next.
#
# Behind nginx the API trusts exactly one proxy hop (TRUST_PROXY=1 in
# docker-compose.yml), so the client address is the one nginx appends to
# X-Forwarded-For below. If another proxy or CDN terminates traffic in front of
# nginx, raise TRUST_PROXY by one per hop.

# Only send "Connection: upgrade" when the client actually asked to upgrade
# (WebSocket / HMR). Otherwise clear the header so upstream keep-alive works.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      '';
}

upstream backend {
  server backend:4000;
  keepalive 32;
}

upstream frontend {
  server frontend:3000;
  keepalive 32;
}

server {
  listen 80;
  client_max_body_size 25m;

  # Security headers.
  #
  # The API sets its own Helmet headers on the responses it serves directly.
  # These cover the responses nginx serves or proxies to the frontend, so a
  # page is never delivered without them.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  # The Content-Security-Policy.
  #
  # The browser only ever talks to this origin, because /api is proxied to the
  # API rather than called cross-origin. The policy therefore allows only
  # same-origin script, style, images and connections.
  #
  # script-src: no 'unsafe-eval' — a Next.js production build never evaluates
  # strings (only the dev server's hot reload does). 'unsafe-inline' remains
  # because Next inlines its bootstrap/flight-data <script> tags; removing it
  # needs per-request nonces (a Next middleware setting a nonce-based CSP),
  # which also turns every page dynamic. Until then, inline script is allowed
  # but everything external is limited to 'self'.
  #
  # style-src 'unsafe-inline' is required because the design tokens are
  # injected as inline style attributes and the reader preview uses a style
  # element for its sandboxed document.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

  location /api/ {
    proxy_pass http://backend;
    # HTTP/1.1 with an empty Connection header lets the upstream keepalive pool
    # reuse connections instead of opening one per request.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 300s;
  }

  location / {
    proxy_pass http://frontend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
  }
}

# ---------------------------------------------------------------------------
# TLS template (HSTS-ready). Not active: the stack listens on plain HTTP and is
# published on 127.0.0.1 by default (DOCKER_PUBLIC_BIND). To serve the public
# internet directly from this nginx:
#
#   1. Mount certificates, e.g. ./nginx/certs:/etc/nginx/certs:ro, and publish
#      443 (and 80 for the redirect) in docker-compose.yml.
#   2. Uncomment both blocks below, set server_name, and remove `listen 80;`
#      from the server above (the redirect block takes port 80).
#   3. Set DOCKER_PUBLIC_URL=https://your.domain so cookies are Secure and
#      auth callbacks use https.
#   4. Enable HSTS only after HTTPS works on every subdomain you serve: browsers
#      cache it for max-age. Add `preload` only if you intend to submit the
#      domain to the preload list.
#
# server {
#   listen 80;
#   server_name example.com;
#   return 301 https://$host$request_uri;
# }
#
# server {
#   listen 443 ssl;
#   http2 on;
#   server_name example.com;
#   ssl_certificate     /etc/nginx/certs/fullchain.pem;
#   ssl_certificate_key /etc/nginx/certs/privkey.pem;
#   ssl_protocols TLSv1.2 TLSv1.3;
#   ssl_session_cache shared:SSL:10m;
#   ssl_session_timeout 1d;
#   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#   # ...then repeat the security headers (add_header does not inherit once a
#   # block sets its own), client_max_body_size and both location blocks above.
# }
